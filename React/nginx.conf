# Porta de entrada da aplicação no Docker: entrega o front-end e encaminha a
# API para o Django, tudo na mesma origem (o navegador não precisa de CORS).

server {
    listen 80;
    server_name _;

    # Uploads de imagens de produtos e matérias-primas.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # API, admin do Django e os arquivos estáticos do admin.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagens enviadas pelos usuários, lidas do volume compartilhado com a API.
    location /media/ {
        alias /var/www/media/;
    }

    # Front-end: rotas do React Router caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
