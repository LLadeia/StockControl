# Ambiente local completo: banco, API e front-end.
#
#     docker compose up --build
#
# Aplicação em http://localhost:8080 (API em /api/, admin em /admin/).
#
# Os padrões abaixo são de desenvolvimento e funcionam sem nenhum arquivo de
# configuração. Para alterá-los, crie um .env nesta pasta (veja .env.example).

name: stockcontrol

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-stockcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockcontrol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Só na máquina local, para rodar a API e os testes fora do Docker.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./Django
      target: app
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-stockcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-stockcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockcontrol}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build:
      context: ./React
    depends_on:
      - api
    volumes:
      - media:/var/www/media:ro
    ports:
      - "${WEB_PORT:-8080}:80"

  # Suíte de testes contra o PostgreSQL do compose:
  #     docker compose run --rm tests
  tests:
    profiles: ["tests"]
    build:
      context: ./Django
      target: test
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-stockcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockcontrol}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
